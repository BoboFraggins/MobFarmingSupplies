plugins {
    id 'dev.architectury.loom' version '1.14.476' apply false
    id 'architectury-plugin' version '3.5.166' apply false
    id 'io.github.goooler.shadow' version '8.1.8' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

subprojects {
    apply plugin: 'maven-publish'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    group = mod_group_id
    version = mod_version

    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven {
            name = 'Curios Maven'
            url = 'https://maven.theillusivec4.top'
            content { includeGroup 'top.theillusivec4.curios' }
        }
        maven { url = 'https://maven.nucleoid.xyz/releases' }
        maven { url = 'https://maven.ladysnake.org/releases' }
        maven { url = 'https://modmaven.dev/' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xmaxerrs' << '2000' << '-Xmaxwarns' << '2000' << '-Xlint:deprecation' << '-Xlint:unchecked'
    }
}
