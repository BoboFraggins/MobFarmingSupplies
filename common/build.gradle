architectury {
    common('neoforge', 'fabric')
}

dependencies {
    // Compile common code against the Fabric loader so Architectury's abstraction layer resolves
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modApi "dev.architectury:architectury:${architectury_version}"

    // Jade optional-dependency API — NeoForge artifact used for compilation; API is cross-platform.
    // Fabric uses the +fabric build (see fabric/build.gradle).
    modCompileOnly "maven.modrinth:jade:15.10.6+neoforge"

    // JEI optional-dependency API (19.64.0.454 for NeoForge) — same cross-platform-API situation as Jade above.
    modCompileOnly "maven.modrinth:jei:viLBV5kx"
}

publishing {
    publications {
        register('mavenCommon', MavenPublication) {
            artifactId = "${mod_id}-common"
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/../repo" }
    }
}
