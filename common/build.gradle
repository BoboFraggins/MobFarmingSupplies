architectury {
    common('neoforge', 'fabric')
}

dependencies {
    // Compile common code against the Fabric loader so Architectury's abstraction layer resolves
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    api "dev.architectury:architectury:${architectury_version}"

    // Jade optional-dependency API — NeoForge artifact used for compilation; API is cross-platform.
    // Fabric uses 26.3.1+fabric (see fabric/build.gradle).
    compileOnly "maven.modrinth:jade:26.3.1+neoforge"

    // JEI optional-dependency API — same cross-platform-API situation as Jade above. No stable
    // release exists yet for MC 26.3, only beta builds (same situation NeoForge itself was in).
    compileOnly "maven.modrinth:jei:k98tjGYK"
}

publishing {
    publications {
        register('mavenCommon', MavenPublication) {
            artifactId = "${mod_id}-common"
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/../repo" }
    }
}
