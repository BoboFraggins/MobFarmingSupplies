architectury {
    common('forge', 'fabric')
}

dependencies {
    // Compile common code against the Fabric loader so Architectury's abstraction layer resolves
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modApi "dev.architectury:architectury:${architectury_version}"

    // Jade optional-dependency API — Fabric artifact used for compilation; API is cross-platform.
    // Fabric uses the +fabric build (see fabric/build.gradle).
    modCompileOnly "maven.modrinth:jade:11.13.3+fabric"

    // JEI optional-dependency API (15.75.0.242 for Fabric, Modrinth id 3DMUTARI) — same cross-platform-API situation as Jade above.
    modCompileOnly "maven.modrinth:jei:3DMUTARI"
}

publishing {
    publications {
        register('mavenCommon', MavenPublication) {
            artifactId = "${mod_id}-common"
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/../repo" }
    }
}
