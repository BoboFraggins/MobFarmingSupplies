apply plugin: 'io.github.goooler.shadow'

architectury {
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Local mods added here show up in dev runs without being a compile dependency
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

loom {
    runs {
        client {
            client()
            property 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArg '--nogui'
            property 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Curios Maven'
        url = 'https://maven.theillusivec4.top'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neo_version}"

    modApi "dev.architectury:architectury-neoforge:${architectury_version}"

    modCompileOnly "maven.modrinth:jade:15.10.6+neoforge"
    modCompileOnly "maven.modrinth:jei:viLBV5kx"

    // Curios soft dependency.
    modCompileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"

    // Mekanism soft dependency (chemicals through the Omnidirectional Hopper).
    modCompileOnly "mekanism:Mekanism:1.21.1-10.7.19.85:api"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : neoforge_loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        architectury_version   : architectury_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

// 1.21.1 is obfuscated: the shadow jar holds development (Mojang) names, and remapJar turns it into
// the release jar, mobfarmingsupplies-<version>-neoforge.jar.
shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    configurations = [project.configurations.shadowCommon]
    archiveBaseName = mod_id
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveBaseName = mod_id
    archiveClassifier = 'neoforge'
}

jar {
    archiveClassifier = 'dev'
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        register('mavenNeoForge', MavenPublication) {
            artifactId = "${mod_id}-neoforge"
            artifact(remapJar) { classifier null }
            artifact(sourcesJar) { classifier 'sources' }
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/../repo" }
    }
}
