modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
iconFile="assets/mobfarmingsupplies/icon.png"
description='''
MobFarmingSupplies - Mob processing utilities for Minecraft.
'''

[[mixins]]
config="mobfarmingsupplies-common.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
type="required"
versionRange="[${architectury_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[26,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[30,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="tremendousstorage"
type="optional"
versionRange="[*,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aquaculture"
type="optional"
versionRange="[*,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aether_ii"
type="optional"
versionRange="[*,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="evilcraft"
type="optional"
versionRange="[*,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[16.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="solcarrot"
type="optional"
versionRange="[*,)"
ordering="NONE"
side="BOTH"

# Mekanism is ordered first so its chemical capability exists before the Omnidirectional Hopper
# looks it up by name (see OmniHopperChemicals).
[[dependencies.${mod_id}]]
modId="mekanism"
type="optional"
versionRange="[*,)"
ordering="AFTER"
side="BOTH"

# Modonomicon shows the in-game guide book (data only, no code dependency).
[[dependencies.${mod_id}]]
modId="modonomicon"
type="optional"
versionRange="[*,)"
ordering="NONE"
side="BOTH"
