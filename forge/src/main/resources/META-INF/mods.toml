modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/mobfarmingsupplies/icon.png"
description='''
MobFarmingSupplies - Mob processing utilities for Minecraft.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version_min},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="[${architectury_version_min},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
mandatory=false
versionRange="[11,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="tremendousstorage"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aquaculture"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aether_ii"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="evilcraft"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="solcarrot"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# Mekanism is ordered first so its chemical capability exists before the Omnidirectional Hopper
# looks it up by name (see OmniHopperChemicals).
[[dependencies.${mod_id}]]
modId="mekanism"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"

# Modonomicon shows the in-game guide book (data only, no code dependency).
[[dependencies.${mod_id}]]
modId="modonomicon"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"
