# Gradle performance settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft and Forge versions
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Built and run in development against these; the minimums below are what the mod declares it needs.
forge_version=47.2.0
forge_version_min=47.2.0
forge_loader_version_range=[47,)

# Fabric
fabric_loader_version=0.16.10
fabric_loader_version_min=0.15.0
fabric_api_version=0.92.2+1.20.1

# Architectury
architectury_version=9.2.14
architectury_version_min=9.2.14

# MixinExtras, bundled into the Forge jar (Fabric Loader has its own)
mixinextras_version=0.4.1

# Mod metadata
mod_id=mobfarmingsupplies
mod_name=MobFarmingSupplies
mod_license=MIT
mod_version=1.20.1.0
mod_group_id=net.bobofraggins.mobfarmingsupplies
