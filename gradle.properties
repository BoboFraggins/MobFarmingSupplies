# Gradle performance settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft and NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# Built and run in development against these; the minimums below are what the mod declares it
# needs (the earliest 1.21.1 versions it compiles against).
neo_version=21.1.262
neo_version_min=21.1.1
neoforge_loader_version_range=[1,)

# Fabric
fabric_loader_version=0.18.4
fabric_loader_version_min=0.15.11
fabric_api_version=0.116.17+1.21.1

# Architectury
architectury_version=13.0.11
architectury_version_min=13.0.1

# Mod metadata
mod_id=mobfarmingsupplies
mod_name=MobFarmingSupplies
mod_license=MIT
mod_version=1.21.1.1
mod_group_id=net.bobofraggins.mobfarmingsupplies
