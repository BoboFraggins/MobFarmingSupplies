apply plugin: 'io.github.goooler.shadow'

architectury {
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

loom {
    runs {
        client { client() }
        server {
            server()
            programArg '--nogui'
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${architectury_version}"

    modCompileOnly "maven.modrinth:jade:15.10.6+fabric"
    modCompileOnly "maven.modrinth:trinkets:3.10.0"
    // Trinkets' API types extend Cardinal Components ones.
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.2"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        fabric_loader_version  : fabric_loader_version,
        fabric_loader_version_min: fabric_loader_version_min,
        minecraft_version      : minecraft_version,
        architectury_version   : architectury_version,
        architectury_version_min: architectury_version_min,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// 1.21.1 is obfuscated: the shadow jar holds development (Mojang) names, and remapJar turns it into
// the release jar, mobfarmingsupplies-<version>-fabric.jar.
shadowJar {
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'architectury.common.json'
    configurations = [project.configurations.shadowCommon]
    archiveBaseName = mod_id
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveBaseName = mod_id
    archiveClassifier = 'fabric'
}

jar {
    archiveClassifier = 'dev'
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        register('mavenFabric', MavenPublication) {
            artifactId = "${mod_id}-fabric"
            artifact(remapJar) { classifier null }
            artifact(sourcesJar) { classifier 'sources' }
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/../repo" }
    }
}
